<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Ludo</title>
  <meta name="description" content="Classic Ludo — play with friends or the computer, works offline">
  <meta name="theme-color" content="#0b3a8c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ludo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===== Start screen ===== -->
  <section id="screen-menu" class="screen active">
    <div class="menu-wrap">
      <div class="logo-holder"><img class="logo-img" src="assets/logo.webp" alt="Ludo Don" width="768" height="512"></div>

      <!-- home: the four game cards -->
      <div class="view home-grid" data-view="home">
        <button id="btn-resume" class="mode-card resume" hidden><span class="mc-t">Resume Last Game</span></button>
        <button class="mode-card img-card" data-go="computer" aria-label="Play with Computer"><img src="assets/menu/computer.webp" alt="" width="560" height="560" decoding="async" draggable="false"></button>
        <button class="mode-card img-card" data-soon aria-label="Play Online (coming soon)"><img src="assets/menu/online.webp" alt="" width="560" height="560" decoding="async" draggable="false"><span class="soon">Coming soon</span></button>
        <button class="mode-card img-card" data-go="offline" aria-label="Play Offline"><img src="assets/menu/offline.webp" alt="" width="560" height="560" decoding="async" draggable="false"></button>
        <button class="mode-card img-card" data-go="partners" aria-label="Play as Partners"><img src="assets/menu/partners.webp" alt="" width="560" height="560" decoding="async" draggable="false"></button>
        <button id="btn-install" class="btn-lite" hidden>Install App</button>
      </div>

      <!-- Play with Computer -->
      <div class="view" data-view="computer" hidden>
        <h2 class="vt">Play with Computer</h2>
        <button class="opt" data-preset="c1">You vs 1 Computer</button>
        <button class="opt" data-preset="c2">You vs 2 Computers</button>
        <button class="opt" data-preset="c3">You vs 3 Computers</button>
        <button class="opt alt" data-go="custom">Custom game</button>
        <button class="back" data-go="home">&lsaquo; Back</button>
      </div>

      <!-- Play as Partners (2 v 2, partners sit opposite: red+yellow, green+blue) -->
      <div class="view" data-view="partners" hidden>
        <h2 class="vt">Play as Partners</h2>
        <button class="opt" data-preset="t1">You + Computer vs 2 Computers</button>
        <button class="opt" data-preset="t2">2 Friends vs 2 Computers</button>
        <button class="opt" data-preset="t4">2 Friends vs 2 Friends</button>
        <button class="back" data-go="home">&lsaquo; Back</button>
      </div>

      <!-- Play Offline -->
      <div class="view" data-view="offline" hidden>
        <h2 class="vt">Play Offline</h2>
        <button class="opt" data-preset="p2">2 Players</button>
        <button class="opt" data-preset="p3">3 Players</button>
        <button class="opt" data-preset="p4">4 Players</button>
        <button class="opt alt" data-go="custom">Custom game</button>
        <button class="back" data-go="home">&lsaquo; Back</button>
      </div>

      <!-- Custom: choose Human / CPU / Off for each colour -->
      <div class="view" data-view="custom" hidden>
        <h2 class="vt">Custom game</h2>
        <p class="sub">Choose Human, CPU or Off for each colour</p>
        <div id="seats" class="seats"></div>
        <p id="menu-error" class="error" hidden></p>
        <button id="btn-start" class="opt primary">Start Game</button>
        <button class="back" data-go="home">&lsaquo; Back</button>
      </div>
    </div>
    <div id="toast" class="toast" hidden>Coming soon</div>
  </section>

  <!-- ===== Game ===== -->
  <section id="screen-game" class="screen">
    <header class="topbar">
      <button id="btn-menu" class="icon-btn" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.3 7.3 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.5h4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
    </header>
    <main class="stage">
      <div class="dice-slot" data-c="green"><button class="dice" aria-label="Green dice" disabled></button><span class="medal"></span></div>
      <div class="dice-slot" data-c="red"><button class="dice" aria-label="Red dice" disabled></button><span class="medal"></span></div>
      <div id="board" class="board">
        <img class="board-bg" src="assets/board/board.webp" alt="Ludo board" width="900" height="900" decoding="async" draggable="false">
        <div id="pieces" class="pieces"></div>
        <div id="picker" class="picker" hidden></div>
      </div>
      <div class="dice-slot" data-c="yellow"><button class="dice" aria-label="Yellow dice" disabled></button><span class="medal"></span></div>
      <div class="dice-slot" data-c="blue"><button class="dice" aria-label="Blue dice" disabled></button><span class="medal"></span></div>
    </main>
  </section>

  <!-- ===== Overlay (menu / result) ===== -->
  <div id="overlay" class="overlay" hidden>
    <div class="card">
      <h2 id="ov-title"></h2>
      <ol id="ov-list" class="rank-list"></ol>
      <div id="ov-extra"></div>
      <div id="ov-actions" class="actions"></div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>

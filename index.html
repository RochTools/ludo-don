<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Ludo</title>
  <meta name="description" content="Classic Ludo — play with friends or the computer, works offline">
  <meta name="theme-color" content="#0b3a8c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ludo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===== Start screen ===== -->
  <section id="screen-menu" class="screen active">
    <div class="menu-wrap">
      <div class="logo-holder"><img class="logo-img" src="assets/logo.webp" alt="Ludo Don" width="768" height="512"></div>

      <!-- home: the four game cards -->
      <div class="view home-grid" data-view="home">
        <button id="btn-resume" class="mode-card resume" hidden><span class="mc-t">Resume Last Game</span></button>
        <button class="mode-card" data-go="computer"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="9" width="52" height="34" rx="6" fill="#1d4ed8"/><rect x="10" y="13" width="44" height="26" rx="3" fill="#60a5fa"/><circle cx="24" cy="21" r="3.2" fill="#fff"/><circle cx="40" cy="21" r="3.2" fill="#fff"/><circle cx="32" cy="26" r="3.2" fill="#fff"/><circle cx="24" cy="31" r="3.2" fill="#fff"/><circle cx="40" cy="31" r="3.2" fill="#fff"/><path d="M26 43h12l3 8H23z" fill="#1d4ed8"/><rect x="16" y="51" width="32" height="5" rx="2.5" fill="#93a8d6"/></svg><span class="mc-t">Play with Computer</span></button>
        <button class="mode-card" data-soon><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="25" fill="#22c55e"/><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="32" cy="32" r="25" stroke="#15803d"/><ellipse cx="32" cy="32" rx="11" ry="25"/><path d="M8 24h48M8 40h48M32 7v50"/></g></svg><span class="mc-t">Play Online</span><span class="soon">Coming soon</span></button>
        <button class="mode-card" data-go="offline"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="12" cy="28.8" r="6.8" fill="#ef4444"/><path d="M1.0 52.6c0-8.5 5.1-14.4 11.0-14.4s11.0 6.0 11.0 14.4z" fill="#ef4444"/><circle cx="52" cy="28.8" r="6.8" fill="#3b82f6"/><path d="M41.0 52.6c0-8.5 5.1-14.4 11.0-14.4s11.0 6.0 11.0 14.4z" fill="#3b82f6"/><circle cx="32" cy="23.2" r="9.2" fill="#22c55e"/><path d="M17.1 55.4c0-11.5 6.9-19.5 14.9-19.5s14.9 8.0 14.9 19.5z" fill="#22c55e"/></svg><span class="mc-t">Play Offline</span></button>
        <button class="mode-card" data-soon><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="18" cy="26.8" r="8.8" fill="#ef4444"/><path d="M3.7 57.6c0-11.0 6.6-18.7 14.3-18.7s14.3 7.7 14.3 18.7z" fill="#ef4444"/><circle cx="46" cy="26.8" r="8.8" fill="#eab308"/><path d="M31.7 57.6c0-11.0 6.6-18.7 14.3-18.7s14.3 7.7 14.3 18.7z" fill="#eab308"/><path d="M32 19c-6-4-8-7-8-10a4 4 0 0 1 8-1a4 4 0 0 1 8 1c0 3-2 6-8 10z" fill="#f43f5e"/></svg><span class="mc-t">Play as Partners</span><span class="soon">Coming soon</span></button>
        <button id="btn-install" class="btn-lite" hidden>Install App</button>
      </div>

      <!-- Play with Computer -->
      <div class="view" data-view="computer" hidden>
        <h2 class="vt">Play with Computer</h2>
        <button class="opt" data-preset="c1">You vs 1 Computer</button>
        <button class="opt" data-preset="c2">You vs 2 Computers</button>
        <button class="opt" data-preset="c3">You vs 3 Computers</button>
        <button class="opt" data-preset="c22">2 Friends vs 2 Computers</button>
        <button class="opt alt" data-go="custom">Custom game</button>
        <button class="back" data-go="home">&lsaquo; Back</button>
      </div>

      <!-- Play Offline -->
      <div class="view" data-view="offline" hidden>
        <h2 class="vt">Play Offline</h2>
        <button class="opt" data-preset="p2">2 Players</button>
        <button class="opt" data-preset="p3">3 Players</button>
        <button class="opt" data-preset="p4">4 Players</button>
        <button class="opt alt" data-go="custom">Custom game</button>
        <button class="back" data-go="home">&lsaquo; Back</button>
      </div>

      <!-- Custom: choose Human / CPU / Off for each colour -->
      <div class="view" data-view="custom" hidden>
        <h2 class="vt">Custom game</h2>
        <p class="sub">Choose Human, CPU or Off for each colour</p>
        <div id="seats" class="seats"></div>
        <p id="menu-error" class="error" hidden></p>
        <button id="btn-start" class="opt primary">Start Game</button>
        <button class="back" data-go="home">&lsaquo; Back</button>
      </div>
    </div>
    <div id="toast" class="toast" hidden>Coming soon</div>
  </section>

  <!-- ===== Game ===== -->
  <section id="screen-game" class="screen">
    <header class="topbar">
      <button id="btn-menu" class="icon-btn" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg></button>
    </header>
    <main class="stage">
      <div class="dice-slot" data-c="green"><button class="dice" aria-label="Green dice" disabled></button><span class="medal"></span></div>
      <div class="dice-slot" data-c="red"><button class="dice" aria-label="Red dice" disabled></button><span class="medal"></span></div>
      <div id="board" class="board">
        <img class="board-bg" src="assets/board/board.webp" alt="Ludo board" draggable="false">
        <div id="pieces" class="pieces"></div>
        <div id="picker" class="picker" hidden></div>
      </div>
      <div class="dice-slot" data-c="yellow"><button class="dice" aria-label="Yellow dice" disabled></button><span class="medal"></span></div>
      <div class="dice-slot" data-c="blue"><button class="dice" aria-label="Blue dice" disabled></button><span class="medal"></span></div>
    </main>
  </section>

  <!-- ===== Overlay (menu / result) ===== -->
  <div id="overlay" class="overlay" hidden>
    <div class="card">
      <h2 id="ov-title"></h2>
      <ol id="ov-list" class="rank-list"></ol>
      <div id="ov-extra"></div>
      <div id="ov-actions" class="actions"></div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
